<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Backup Settings</title>
  <style>
    :root {
      --bg: #141414;
      --sidebar: #1d1e1f;
      --border: #303030;
      --primary: #ff6c37;
      --text: #cfd3dc;
    }
    body {
      margin: 0; padding: 20px;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
    }
    h2 { margin-top: 0; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .section { background: var(--sidebar); border: 1px solid var(--border); border-radius: 6px; padding: 15px; margin-bottom: 20px; }
    .row { display: flex; align-items: center; margin-bottom: 12px; gap: 15px; }
    
    .row > label { width: 130px; font-weight: bold; font-size: 14px; flex-shrink: 0; }
    
    input[type="text"], input[type="number"], input[type="time"], select {
      background: #1e1e1e; border: 1px solid var(--border); color: var(--text);
      padding: 6px 10px; border-radius: 4px; outline: none; flex: 1;
    }
    button {
      background: #2b2b2c; border: 1px solid #414243; color: var(--text);
      padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #414243; color: #fff; }
    button.primary { background: var(--primary); color: #fff; border: none; font-weight: bold; }
    button.primary:hover { background: #e05c2a; }
    button.danger { background: #ea2027; color: #fff; border: none; }
    .toggle-container { display: flex; align-items: center; gap: 10px; }
    
    .switch { position: relative; display: inline-block; width: 40px !important; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #414243; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .file-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); background: #1e1e1e; font-size: 13px; }
    .file-item:last-child { border-bottom: none; }
    .file-info { display: flex; flex-direction: column; gap: 4px; }
    .file-name { color: var(--primary); font-family: monospace; }
    .file-size { color: #888; font-size: 12px; }
    .file-actions { display: flex; gap: 6px; }
    
    .status { margin-top: 15px; font-size: 13px; color: #0cbb52; display: none; }
  </style>
</head>
<body>
  <h2>Backup Settings</h2>
  <div class="section">
    <div class="row">
      <label>Auto Backup</label>
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="enabled">
          <span class="slider"></span>
        </label>
        <span id="enable-text" style="font-size: 13px; color: #888;">Disabled</span>
      </div>
    </div>
    <div class="row">
      <label>Store Folder</label>
      <input type="text" id="folder" readonly placeholder="Select a folder...">
      <button id="btn-browse">Browse</button>
    </div>
    <div class="row">
      <label>Frequency</label>
      <select id="frequency">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>
    </div>
    <div class="row" id="row-day" style="display: none;">
      <label>Day of Week</label>
      <select id="dayOfWeek">
        <option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option>
        <option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option>
      </select>
    </div>
    
    <div class="row" style="align-items: flex-start;">
      <label style="margin-top: 6px;">Backup Times</label>
      <div style="flex: 1;">
        <div id="times-container" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px;"></div>
        <button id="btn-add-time" style="font-size: 12px; padding: 4px 8px;">+ Add Time</button>
      </div>
    </div>

    <div class="row">
      <label>Keep # of Days</label>
      <input type="number" id="maxDays" min="1" max="365" value="30">
    </div>
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button class="primary" id="btn-save">
        Save Config
      </button>
      <button id="btn-backup-now">Backup Now</button>
      <span class="status" id="save-status">Saved!</span>
    </div>
  </div>

  <h2>Backup Files</h2>
  <div class="section" style="padding: 0; border: none; background: transparent;">
    <div class="file-list" id="file-list">
      <div style="padding: 15px; text-align: center; color: #888; font-size: 13px;">Loading...</div>
    </div>
  </div>

  <script>
    const ipc = window.electron.ipcRenderer;
    const el = (id) => document.getElementById(id);
    const formatSize = (bytes) => { if (bytes === 0) return '0 B'; const k = 1024, sizes = ['B', 'KB', 'MB']; const i = Math.floor(Math.log(bytes) / Math.log(k)); return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i]; }
    const formatDate = (ms) => new Date(ms).toLocaleString();

    let currentTimes = ['02:00'];

    // 渲染动态时间列表
    function renderTimes() {
      const container = el('times-container');
      container.innerHTML = currentTimes.map((t, i) => `
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="time" value="${t}" onchange="updateTime(${i}, this.value)">
          ${currentTimes.length > 1 ? `<button class="danger" style="padding: 4px 8px;" onclick="removeTime(${i})">X</button>` : ''}
        </div>
      `).join('');
      // 限制最多添加 10 个时间点
      el('btn-add-time').style.display = currentTimes.length >= 10 ? 'none' : 'inline-block';
    }

    window.updateTime = (index, val) => { currentTimes[index] = val; };
    window.removeTime = (index) => { currentTimes.splice(index, 1); renderTimes(); };
    el('btn-add-time').addEventListener('click', () => {
       if(currentTimes.length < 10) { currentTimes.push('12:00'); renderTimes(); }
    });

    async function loadConfig() {
      const config = await ipc.invoke('backup-get-config');
      el('enabled').checked = config.enabled;
      el('enable-text').innerText = config.enabled ? 'Enabled' : 'Disabled';
      el('folder').value = config.folder || '';
      el('frequency').value = config.frequency;
      el('dayOfWeek').value = config.dayOfWeek;
      el('maxDays').value = config.maxDays;
      el('row-day').style.display = config.frequency === 'weekly' ? 'flex' : 'none';
      
      // 加载数组时间
      if (config.times && config.times.length > 0) {
        currentTimes = config.times;
      } else if (config.time) { // 兼容老数据
        currentTimes = [config.time];
      }
      renderTimes();
    }

    async function loadFiles() {
      const files = await ipc.invoke('backup-get-files');
      const container = el('file-list');
      if (files.length === 0) {
        container.innerHTML = '<div style="padding: 15px; text-align: center; color: #888; font-size: 13px;">No backups found.</div>';
        return;
      }
      container.innerHTML = files.map(f => `
        <div class="file-item">
          <div class="file-info">
            <span class="file-name">${f.name}</span>
            <span class="file-size">${formatDate(f.time)} • ${formatSize(f.size)}</span>
          </div>
          <div class="file-actions">
            <button onclick="restoreFile('${f.path.replace(/\\/g, '\\\\')}')">Restore</button>
            <button class="danger" onclick="deleteFile('${f.path.replace(/\\/g, '\\\\')}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    el('frequency').addEventListener('change', (e) => { el('row-day').style.display = e.target.value === 'weekly' ? 'flex' : 'none'; });
    el('enabled').addEventListener('change', (e) => { el('enable-text').innerText = e.target.checked ? 'Enabled' : 'Disabled'; });
    el('btn-browse').addEventListener('click', async () => { const folder = await ipc.invoke('backup-select-folder'); if (folder) el('folder').value = folder; });

    el('btn-save').addEventListener('click', async () => {
      // 过滤掉可能存在的空值，并去重
      const validTimes = [...new Set(currentTimes.filter(t => t))].sort();
      
      const config = {
        enabled: el('enabled').checked, 
        folder: el('folder').value, 
        frequency: el('frequency').value,
        dayOfWeek: parseInt(el('dayOfWeek').value), 
        times: validTimes, // 保存数组而不是单个字符串
        maxDays: parseInt(el('maxDays').value)
      };
      await ipc.invoke('backup-save-config', config);
      const status = el('save-status'); status.style.display = 'inline-block'; status.innerText = 'Config Saved!';
      setTimeout(() => status.style.display = 'none', 2000); loadFiles();
    });

    el('btn-backup-now').addEventListener('click', async () => {
      if (!el('folder').value) return alert('Please set a backup folder first and Save Config.');
      el('btn-backup-now').innerText = 'Running...';
      const res = await ipc.invoke('backup-execute-now');
      el('btn-backup-now').innerText = 'Backup Now';
      if (res.success) {
        const status = el('save-status'); status.style.display = 'inline-block'; status.innerText = 'Backup Success!';
        setTimeout(() => status.style.display = 'none', 2000); loadFiles();
      } else { alert('Backup failed: ' + res.message); }
    });

    window.restoreFile = async (path) => {
      if (confirm('Are you sure you want to restore this backup? ALL current data will be replaced, and the app will reload.')) {
        const res = await ipc.invoke('backup-restore-file', path);
        if (!res.success) alert('Restore failed: ' + res.message);
      }
    };

    window.deleteFile = async (path) => {
      if (confirm('Delete this backup file permanently?')) {
        const res = await ipc.invoke('backup-delete-file', path);
        if (res.success) loadFiles(); else alert('Delete failed: ' + res.message);
      }
    };

    loadConfig().then(loadFiles);
  </script>
</body>
</html>
